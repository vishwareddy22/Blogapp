<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Blog Platform</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; }
        header { background-color: #2c3e50; color: white; padding: 1.5rem; text-align: center; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .form-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-box input, .form-box textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .form-box textarea { height: 100px; resize: vertical; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #219653; }
        .post-card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .post-card h3 { margin-top: 0; color: #2c3e50; }
        .post-meta { font-size: 12px; color: #7f8c8d; margin-bottom: 10px; }
        .delete-btn { background-color: #e74c3c; padding: 5px 10px; font-size: 12px; position: absolute; top: 20px; right: 20px; }
        .delete-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <header>
        <h1>CodeAlpha Community Blog</h1>
    </header>

    <div class="container">
        <!-- Create Post Form -->
        <div class="form-box">
            <h3>Create a New Post</h3>
            <input type="text" id="title" placeholder="Post Title">
            <input type="text" id="author" placeholder="Your Name">
            <textarea id="content" placeholder="Write your blog content here..."></textarea>
            <button onclick="createPost()">Publish Post</button>
        </div>

        <h2>Recent Posts</h2>
        <div id="posts-container">
            <!-- Posts load here dynamically -->
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/posts';

        async function fetchPosts() {
            try {
                const res = await fetch(API_URL);
                const posts = await res.json();
                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                if (posts.length === 0) {
                    container.innerHTML = '<p>No blog posts found. Be the first to write one!</p>';
                    return;
                }

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `
                        <button class="delete-btn" onclick="deletePost('${post._id}')">Delete</button>
                        <h3>${escapeHtml(post.title)}</h3>
                        <div class="post-meta">By ${escapeHtml(post.author || 'Anonymous')} on ${new Date(post.createdAt).toLocaleDateString()}</div>
                        <p>${escapeHtml(post.content)}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Error fetching posts:', err);
            }
        }

        async function createPost() {
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const content = document.getElementById('content').value;

            if (!title || !content) {
                alert('Please fill in both title and content.');
                return;
            }

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, author, content })
                });

                if (res.ok) {
                    document.getElementById('title').value = '';
                    document.getElementById('author').value = '';
                    document.getElementById('content').value = '';
                    fetchPosts();
                } else {
                    alert('Failed to create post.');
                }
            } catch (err) {
                console.error('Error creating post:', err);
            }
        }

        async function deletePost(id) {
            if (!confirm('Are you sure you want to delete this post?')) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchPosts();
                } else {
                    alert('Failed to delete post.');
                }
            } catch (err) {
                console.error('Error deleting post:', err);
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        fetchPosts();
    </script>
</body>
</html>
